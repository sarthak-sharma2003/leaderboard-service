# Local stack: docker compose up --build   (gRPC on localhost:9090)
services:
  app:
    build: .
    ports: ["9090:9090"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leaderboard
      SPRING_DATASOURCE_USERNAME: leaderboard
      SPRING_DATASOURCE_PASSWORD: leaderboard
      SPRING_DATA_REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
    healthcheck:
      test: pg_isready -U leaderboard
      interval: 2s
  redis:
    image: redis:8-alpine
